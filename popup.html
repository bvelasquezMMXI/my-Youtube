<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Customizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="10" height="10">
    <h1>YouTube Customizer</h1>
  </header>

  <nav class="subtabs" id="subtabs" role="tablist" aria-orientation="horizontal" aria-label="Options"></nav>

  <main>
    <section class="panel" id="panel" role="tabpanel">
      <p class="empty" id="panel-empty"></p>
      <div class="option" id="videos-per-row" hidden>
        <label class="option-label" for="videos-per-row-number">Videos per row</label>
        <input class="option-number" id="videos-per-row-number" type="number" min="1" max="8" step="1" value="4">
        <input class="option-range" id="videos-per-row-range" type="range" min="1" max="8" step="1" value="4" aria-label="Videos per row slider">
      </div>
      <div class="option" id="ui-corner-radii" hidden>
        <label class="option-label" for="ui-corner-radii-number">UI corner radii</label>
        <input class="option-number" id="ui-corner-radii-number" type="number" min="0" max="30" step="1" value="12">
        <input class="option-range" id="ui-corner-radii-range" type="range" min="0" max="30" step="1" value="12" aria-label="UI corner radii slider">
      </div>
      <div class="option option-toggle" id="native-layout" hidden>
        <label class="option-label" for="native-layout-checkbox">
          <input class="option-check" id="native-layout-checkbox" type="checkbox">
          <span>Use YouTube's native layout</span>
        </label>
      </div>
      <div class="option option-toggle" id="no-ai" hidden>
        <label class="option-label" for="no-ai-checkbox">
          <input class="option-check" id="no-ai-checkbox" type="checkbox">
          <span>Remove "Ask Youtube" ui element</span>
        </label>
      </div>
      <div class="option option-toggle" id="hover-highlights" hidden>
        <label class="option-label" for="hover-highlights-checkbox">
          <input class="option-check" id="hover-highlights-checkbox" type="checkbox" checked>
          <span>Hover highlights</span>
        </label>
      </div>
      <div class="option option-select-row" id="font-family" hidden>
        <label class="option-label" for="font-family-select">Font</label>
        <select class="option-select" id="font-family-select" aria-label="Font">
          <option value="">Original</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Helvetica, Arial, sans-serif">Helvetica</option>
          <option value="Verdana, Geneva, sans-serif">Verdana</option>
          <option value="Tahoma, Verdana, sans-serif">Tahoma</option>
          <option value="'Trebuchet MS', Arial, sans-serif">Trebuchet MS</option>
          <option value="Georgia, 'Times New Roman', serif">Georgia</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif">Impact</option>
        </select>
        <button class="option-upload" id="font-upload" type="button">Upload</button>
        <input id="font-file" type="file" accept=".woff2,.woff,.ttf,.otf,font/*" hidden>
      </div>
      <div id="sidebar-options" hidden>
        <div class="sidebar-tree" id="sidebar-tree"></div>
        <p class="empty" id="sidebar-empty" hidden></p>
      </div>
      <div id="theme-presets" hidden>
        <div class="preset-list" id="preset-list"></div>
        <p class="empty" id="preset-empty" hidden>No presets saved. Use Save to create one.</p>
        <p class="preset-status" id="preset-status" hidden></p>
        <input id="preset-file" type="file" accept=".json,application/json" hidden>
        <div class="preset-toolbar">
          <button class="preset-button" id="preset-save" type="button">Save</button>
          <button class="preset-button" id="preset-load" type="button">Load</button>
          <button class="preset-button preset-json-toggle" id="preset-json-toggle" type="button" title="Show preset JSON" aria-expanded="false">&#9660;</button>
        </div>
        <div class="preset-json" id="preset-json-panel" hidden>
          <textarea class="preset-json-text" id="preset-json-text" spellcheck="false" aria-label="Preset JSON"></textarea>
          <div class="preset-json-actions">
            <button class="preset-button" id="preset-json-save" type="button">Save JSON</button>
            <span class="preset-status" id="preset-json-status" hidden></span>
          </div>
        </div>
      </div>
      <div id="theme-home-colors" hidden>
        <div class="color-tree" id="theme-home-tree"></div>
        <div class="color-image">
          <span class="color-label">Background image</span>
          <span class="color-image-preview" id="theme-bg-image-preview" hidden></span>
          <button class="option-upload" id="theme-bg-image-button" type="button">Choose image</button>
          <button class="color-reset-all" id="theme-bg-image-remove" type="button" hidden>Remove</button>
          <input id="theme-bg-image-file" type="file" accept="image/*" hidden>
        </div>
        <div class="color-toolbar">
          <button class="color-reset-all" id="theme-home-reset" type="button">Reset all colors</button>
        </div>
      </div>
      <div class="option option-toggle" id="add-dislikes" hidden>
        <label class="option-label" for="add-dislikes-checkbox">
          <input class="option-check" id="add-dislikes-checkbox" type="checkbox" checked>
          <span>Add dislikes</span>
        </label>
      </div>
      <div class="option option-toggle" id="remove-hashtags" hidden>
        <label class="option-label" for="remove-hashtags-checkbox">
          <input class="option-check" id="remove-hashtags-checkbox" type="checkbox">
          <span>Remove hashtags</span>
        </label>
      </div>
      <div class="option option-toggle" id="no-recommended" hidden>
        <label class="option-label" for="no-recommended-checkbox">
          <input class="option-check" id="no-recommended-checkbox" type="checkbox">
          <span>Remove recommended videos</span>
        </label>
      </div>
    </section>
  </main>

  <aside class="sidebar" role="tablist" aria-orientation="vertical" aria-label="Modification categories">
    <button class="tab" id="tab-home" type="button" role="tab" aria-controls="panel" data-subtabs="Main|Sidebar" aria-selected="true">Home</button>
    <button class="tab" id="tab-player" type="button" role="tab" aria-controls="panel" data-subtabs="Main" aria-selected="false">Player</button>
    <button class="tab" id="tab-themes" type="button" role="tab" aria-controls="panel" data-subtabs="Presets|Home|Player" aria-selected="false">Themes</button>
  </aside>

  <div class="preset-dialog" id="preset-dialog" hidden>
    <div class="preset-dialog-card" role="dialog" aria-modal="true" aria-labelledby="preset-dialog-title">
      <p class="preset-dialog-title" id="preset-dialog-title">Save current settings</p>
      <div class="preset-choices" id="preset-choices" role="radiogroup" aria-label="Preset to overwrite"></div>
      <label class="preset-name-label">New preset name
        <input class="preset-name-input" id="preset-new-name" type="text" placeholder="My preset" maxlength="40">
      </label>
      <p class="preset-status" id="preset-dialog-status" hidden></p>
      <div class="preset-dialog-actions">
        <button class="preset-button" id="preset-dialog-save" type="button">Save</button>
        <button class="preset-button" id="preset-dialog-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
